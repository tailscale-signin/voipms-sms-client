version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    # Only propose releases that have been public for at least a week.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - "androidx.*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
