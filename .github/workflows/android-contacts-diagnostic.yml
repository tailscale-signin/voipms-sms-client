name: App-only contacts APK smoke
on:
  push:
    branches: [ diagnostics/contacts-dfcb683 ]
jobs:
  contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: voipms-sms-fdroid-debug
          run-id: 45700130252
          github-token: ${{ github.token }}
          path: smoke-apk
      - name: Enable emulator acceleration
        run: sudo chown "$(id -u):$(id -g)" /dev/kvm
      - name: Exercise the encrypted address book on Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          SMS_SMOKE_SCREENSHOTS: ${{ runner.temp }}/contacts-smoke
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 .github/scripts/android-contacts-smoke.py smoke-apk/*.apk
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contacts-smoke-screenshots
          path: ${{ runner.temp }}/contacts-smoke/*.png
          if-no-files-found: ignore
