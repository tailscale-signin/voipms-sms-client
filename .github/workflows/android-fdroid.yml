name: Android CI (F-Droid)

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.2" "build-tools;36.0.0"
      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Prepare source for F-Droid build
        run: sed -i "/fdroid-remove-start/,/fdroid-remove-end/d" build.gradle.kts voipms-sms/build.gradle.kts
      - name: Build with Gradle (F-Droid)
        run: ./gradlew assembleFdroidFullRelease assembleFdroidFullDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: voipms-sms-fdroid-debug
          path: voipms-sms/build/outputs/apk/fdroidFull/debug/*.apk
          if-no-files-found: error
      - name: Test with Gradle (F-Droid)
        run: ./gradlew testFdroidFullDebugUnitTest
      - name: Lint with Gradle (F-Droid)
        id: lint
        run: ./gradlew lintFdroidFullRelease
      - name: Upload lint report (F-Droid)
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: lint-report-fdroid
          path: voipms-sms/build/reports/lint-results-fdroidFullRelease.html

  emulator:
    name: Android 14 app smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: voipms-sms-fdroid-debug
          path: smoke-apk
      - name: Enable emulator acceleration
        run: sudo chown "$(id -u):$(id -g)" /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: python3 .github/scripts/android-smoke.py smoke-apk/*.apk
