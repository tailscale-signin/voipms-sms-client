name: Android CI (primary)

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VOIPMS_PUSH_CALLBACK_URL: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.VOIPMS_PUSH_CALLBACK_URL || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test callback delivery and the browser companion
        run: node --test relay/server.test.mjs companion/server.test.mjs
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Install compile SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;36.0.0'
      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Configure Firebase when the project is provisioned
        env:
          google_services_json: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [[ -n "$google_services_json" ]]; then
            printf '%s' "$google_services_json" | base64 --decode > voipms-sms/src/primary/google-services.json
          fi
      - name: Build with Gradle
        run: ./gradlew assemblePrimaryFullRelease assemblePrimaryFullDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: voipms-sms-primary-debug
          path: voipms-sms/build/outputs/apk/primaryFull/debug/*.apk
          if-no-files-found: error
      - name: Test with Gradle
        run: ./gradlew testPrimaryFullDebugUnitTest
      - name: Lint with Gradle
        id: lint
        run: ./gradlew lintPrimaryFullRelease
      - name: Record the unsigned master APK digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: sha256sum voipms-sms/build/outputs/apk/primaryFull/release/*-unsigned.apk
      - name: Preserve the verified master release APK for signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: voipms-sms-primary-release-unsigned
          path: voipms-sms/build/outputs/apk/primaryFull/release/*-unsigned.apk
          if-no-files-found: error
      - name: Upload lint report
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: lint-report-primary
          path: voipms-sms/build/reports/lint-results-primaryFullRelease.html
