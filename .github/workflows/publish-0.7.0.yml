name: Publish VoIPms SMS 0.7.0
on:
  push:
    branches: [release/publish-0.7.0]
permissions: {}
concurrency:
  group: publish-voipms-sms-0.7.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'tailscale-signin/voipms-sms-client'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v0.7.0
      REV: 0fcb1978bee2f17ea352c6778709b26638dd2f1d
      SHA256: 45378b934dca927588a2b459cbe91fbdf42f099997981fb8af6b26d2c111320b
      CERT: 023103fb5ca64728235d8786f2404f47050f2fb3fe7e8b1aab50e924d07bf43a
      APK: VoIPms-SMS-0.7.0-release.apk
    steps:
      - name: Verify and publish the signed Android release
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::Release verification or publication stopped on script line $LINENO"' ERR
          cd "$RUNNER_TEMP"
          api="repos/$GH_REPO"
          check_refs() {
            [[ "$(gh api "$api/git/ref/heads/master" --jq .object.sha)" == "$REV" ]]
            object=$(gh api "$api/git/matching-refs/tags/$TAG" --jq '.[] | select(.ref == "refs/tags/v0.7.0") | .object')
            if [[ -n "$object" ]]; then
              while [[ "$(jq -r .type <<<"$object")" == tag ]]; do
                object=$(gh api "$api/git/tags/$(jq -r .sha <<<"$object")" --jq .object)
              done
              [[ "$(jq -r .type <<<"$object")" == commit && "$(jq -r .sha <<<"$object")" == "$REV" ]]
            fi
          }
          check_refs
          gh api "$api/contents/release-staging/apk-blobs.txt?ref=$GITHUB_SHA" --jq .content | base64 --decode > blobs.txt
          mapfile -t parts < blobs.txt
          [[ "${#parts[@]}" == 18 ]]
          : > "$APK"
          for part in "${parts[@]}"; do
            [[ "$part" =~ ^[0-9a-f]{40}$ ]]
            gh api "$api/git/blobs/$part" --jq .content | base64 --decode >> "$APK"
          done
          printf '%s  %s\n' "$SHA256" "$APK" | sha256sum --check
          unzip -p "$APK" META-INF/version-control-info.textproto | grep -Fx "  revision: \"$REV\""
          tools="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools"
          signer="$tools/36.0.0/apksigner"
          if [[ ! -x "$signer" ]]; then
            signer=$(find "$tools" -name apksigner -type f | sort -V | tail -n1)
          fi
          test -x "$signer"
          "$signer" verify --verbose --print-certs "$APK" | tee signer.txt
          grep -Ei "certificate SHA-256 digest: *$CERT[[:space:]]*$" signer.txt
          id=457603610
          release=$(gh api "$api/releases/$id")
          jq -e --arg tag "$TAG" --arg target "$REV" '.tag_name == $tag and .target_commitish == $target' <<<"$release" > /dev/null
          asset_digest() {
            gh api "$api/releases/$id/assets" --jq '.[] | select(.name == "VoIPms-SMS-0.7.0-release.apk") | (.digest // "missing")'
          }
          digest=$(asset_digest)
          if [[ "$(jq -r .draft <<<"$release")" == true ]]; then
            if [[ -z "$digest" ]]; then
              curl --fail-with-body --silent --show-error --request POST \
                --header "Authorization: Bearer $GH_TOKEN" --header 'Content-Type: application/vnd.android.package-archive' \
                --data-binary "@$APK" "https://uploads.github.com/$api/releases/$id/assets?name=$APK" > upload.json
              digest=$(jq -er .digest upload.json)
            fi
            [[ "$digest" == "sha256:$SHA256" ]]
            check_refs
            gh api --method PATCH "$api/releases/$id" -F draft=false -f make_latest=true --jq .html_url
          else
            [[ "$digest" == "sha256:$SHA256" ]]
          fi
          for attempt in {1..15}; do
            if [[ "$(gh api "$api/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null)" == "$REV" && "$(asset_digest)" == "sha256:$SHA256" ]]; then
              gh api "$api/releases/$id" --jq 'select(.draft == false) | .html_url'
              exit 0
            fi
            sleep 3
          done
          exit 1
