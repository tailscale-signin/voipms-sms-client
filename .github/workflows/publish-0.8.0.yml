name: Publish VoIPms SMS 0.8.0
on:
  push:
    branches: [release/publish-0.8.0]

permissions: {}
concurrency:
  group: publish-voipms-sms-0.8.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'tailscale-signin/voipms-sms-client'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      REV: 'c8f810fa59374e5cf9069bc82fe2a3eea23c5c1d'
      PRIMARY_RUN: '45724587568'
      FDROID_RUN: '45724587519'
      PAGES_RUN: '45724587530'
      UNSIGNED_SHA256: 'a74a65a93555c232fa38c4e96b0eac56608fe54e4a39d4cbde1b44345dfa0019'
      ARTIFACT_ID: '15075366449'
      ARTIFACT_SHA256: 'a1f5abad33e719731ab4e3e590f3281512a007732a49487041c0e7daba9b058d'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify the green master release artifact
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-0.8.0.sh prepare
      - name: Sign the verified release APK
        if: steps.prepare.outputs.has_signed_asset != 'true'
        env:
          SIGNING_STORE: ${{ secrets.VOIPMS_SMS_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.VOIPMS_RELEASE_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.VOIPMS_SMS_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.VOIPMS_RELEASE_STORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.VOIPMS_SMS_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || secrets.VOIPMS_RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.VOIPMS_SMS_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.VOIPMS_RELEASE_KEY_PASSWORD }}
        run: bash .github/scripts/publish-0.8.0.sh sign
      - name: Verify, publish and download the signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-0.8.0.sh publish
