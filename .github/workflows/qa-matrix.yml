name: Matrix encryption on Android 14
on:
  push:
    branches: [ diagnostics/matrix-encryption-080 ]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;36.0.0'
      - name: Prepare F-Droid and emulator trust policy
        run: |
          sed -i '/fdroid-remove-start/,/fdroid-remove-end/d' build.gradle.kts voipms-sms/build.gradle.kts
          .github/scripts/matrix-integration.sh prepare
      - name: Compile app and instrumentation
        run: ./gradlew assembleFdroidFullDebug assembleFdroidFullDebugAndroidTest
      - uses: actions/upload-artifact@v7
        with:
          name: matrix-app
          path: voipms-sms/build/outputs/apk/fdroidFull/debug/*.apk
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: matrix-test
          path: voipms-sms/build/outputs/apk/androidTest/fdroidFull/debug/*.apk
          if-no-files-found: error
          retention-days: 1
  device:
    name: Exchange encrypted messages on Synapse
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: matrix-app
          path: smoke-apk
      - uses: actions/download-artifact@v7
        with:
          name: matrix-test
          path: matrix-test-apk
      - name: Start disposable Synapse
        run: .github/scripts/matrix-integration.sh setup
      - run: sudo chown "$(id -u):$(id -g)" /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install -r smoke-apk/*.apk
            .github/scripts/matrix-integration.sh test
