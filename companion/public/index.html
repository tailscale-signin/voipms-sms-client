<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light"><title>VoIP.ms Messages</title>
  <link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script>
</head>
<body>
<svg id="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="message" viewBox="0 0 24 24"><path d="M20 14a3 3 0 0 1-3 3H9l-5 4v-4a3 3 0 0 1-2-3V6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3z"/><path d="M7 8h8M7 12h5"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="sync" viewBox="0 0 24 24"><path d="M20 10a8 8 0 0 0-14-4L3 9m0-5v5h5m-4 5a8 8 0 0 0 14 4l3-3m0 5v-5h-5"/></symbol>
  <symbol id="monitor" viewBox="0 0 24 24"><rect x="2.5" y="3" width="19" height="13" rx="2"/><path d="M12 16v4m-5 1h10"/></symbol>
  <symbol id="send" viewBox="0 0 24 24"><path d="m3 10 18-7-6 18-4-7-8-4zM11 14l10-11"/></symbol>
  <symbol id="save" viewBox="0 0 24 24"><path d="M5 3h12l4 4v14H3V3zM7 3v6h9V3M7 21v-8h9v8"/></symbol>
  <symbol id="flag" viewBox="0 0 24 24"><path d="M4 21V4c5-4 9 4 15 0v9c-6 4-10-4-15 0"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></symbol>
  <symbol id="back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></symbol>
</svg>
<header class="top"><a class="brand" href="/"><span class="logo"><svg><use href="#message"/></svg></span>Messages</a><span class="wordmark">VoIP.ms</span><button id="devices" class="quiet" hidden><svg><use href="#monitor"/></svg>Devices</button></header>
<p role="status" id="status" aria-live="polite"></p>
<main>
  <section id="pairing" class="pair" hidden>
    <span class="feature-icon"><svg><use href="#monitor"/></svg></span>
    <h1>Pair this device</h1><p>Use a pairing code from an authorized device or the companion host.</p>
    <form id="pairForm"><label>Pairing code<input id="code" required autocomplete="off" spellcheck="false" maxlength="64"></label>
      <label>Device name<input id="label" required placeholder="Office PC" maxlength="64"></label><button class="primary">Pair device</button></form>
  </section>
  <section id="inbox" class="layout" hidden>
    <aside class="sidebar"><div class="sidebar-head"><h1>Inbox</h1><button id="refresh" class="icon" title="Refresh history" aria-label="Refresh history"><svg><use href="#sync"/></svg></button></div>
      <label for="line">Phone line</label><select id="line"></select>
      <div class="list-head"><span>Conversations</span><button id="newContact" class="icon" aria-label="Open a contact" title="Open a contact"><svg><use href="#plus"/></svg></button></div>
      <nav id="threads" aria-label="Conversations"></nav><small id="historyScope">Recent 30 days</small>
    </aside>
    <section id="detail" class="detail"><div id="empty" class="empty"><svg><use href="#message"/></svg><h2>Select a conversation</h2></div>
      <div id="thread" hidden><header class="thread-head"><button id="back" class="icon" title="Back to inbox" aria-label="Back to inbox"><svg><use href="#back"/></svg></button><div><h2 id="peer"></h2><small id="threadLine"></small></div>
        <button id="claim" class="quiet"><svg><use href="#flag"/></svg><span>Claim</span></button></header>
        <div id="messages" aria-label="Message history"></div><div id="attempts"></div>
        <form id="compose"><label for="body">Reply</label><textarea id="body" rows="2" maxlength="2048"></textarea>
          <div class="actions"><button type="button" id="draft" class="quiet"><svg><use href="#save"/></svg>Save draft</button><button id="sendButton" class="primary"><svg><use href="#send"/></svg>Send SMS</button></div></form>
        <details id="team"><summary>Team notes</summary><div id="notes"></div><form id="noteForm"><label>Note to teammates<input id="note" maxlength="2048" required></label><button>Add note</button></form></details>
        <button id="unshare" class="quiet danger"><svg><use href="#lock"/></svg>Exclude this contact</button>
      </div>
    </section>
  </section>
</main>
<dialog id="deviceDialog"><header><h2>Paired devices</h2><button class="quiet" data-close="deviceDialog">Close</button></header>
  <p id="signedAs"></p><div id="deviceList"></div><button id="newCode" class="primary">Pair another device</button><p id="generated" aria-live="polite"></p></dialog>
<dialog id="contactDialog"><header><h2>Open a contact</h2><button class="quiet" data-close="contactDialog">Close</button></header>
  <form id="contactForm"><label>Phone number<input id="contact" type="tel" required inputmode="tel"></label><label id="consent"><input type="checkbox" id="share"> Share this contact with this line’s authorized users</label><button class="primary">Open conversation</button></form></dialog>
</body></html>
